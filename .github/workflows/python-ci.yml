name: CI/CD assignment

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
      
      #1 Pick up the code 
      - name: pick the code from repo
        uses: actions/checkout@v7

      #2 Install python
      - name: Install python
        uses: action/python@v7

      #3 Install dependenices
      - name:  Install the dependenices
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      #4 Linting
      - name: Lint code with flake8
        run: flake8 src tests

      #5 run test
      - name: Run test with python
        run: pytest --maxfail=1 --disable-warnings -q

      #6 run unit tests
      - name: Run unit tests
        run: pytest -m unit